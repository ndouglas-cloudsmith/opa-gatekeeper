apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sNetworkPolicyRequired
metadata:
  name: require-default-networkpolicy
spec:
  match:
    # 💥 CHANGE: Target Deployments, Pods, etc., not the Namespace itself!
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
      - apiGroups: [""]
        kinds: ["Pod"]
  # Exclude system namespaces (as before)
  excludedNamespaces:
    - kube-system
    - gatekeeper-system
    - kube-public
    - kube-node-lease
