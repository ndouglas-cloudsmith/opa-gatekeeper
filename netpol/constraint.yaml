apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sNetworkPolicyRequired
metadata:
  name: require-default-networkpolicy
spec:
  # The match block is where all resource selection criteria go.
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    # 🎯 CORRECT LOCATION: excludedNamespaces is a sub-field of 'match'
    excludedNamespaces: 
      - kube-system
      - gatekeeper-system
      - kube-public
      - kube-node-lease
