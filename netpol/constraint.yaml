apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sNetworkPolicyRequired
metadata:
  name: require-default-networkpolicy
spec:
  # The match block defines which resources the constraint applies to.
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace"]
    # 💥 CHANGE THIS: Use 'excludedNamespaces' instead of 'exemptions'
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
      - kube-public
      - kube-node-lease
