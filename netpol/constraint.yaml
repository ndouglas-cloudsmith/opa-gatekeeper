apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sNetworkPolicyRequired # This MUST match the kind from the ConstraintTemplate's spec.crd.spec.names.kind
metadata:
  name: require-default-networkpolicy
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    excludedNamespaces: 
      - kube-system
      - gatekeeper-system
      - kube-public
      - kube-node-lease
