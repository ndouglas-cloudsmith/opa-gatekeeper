apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8snetworkpolicyrequired
spec:
  crd:
    spec:
      names:
        kind: K8sNetworkPolicyRequired
  targets:
    - target: admission.k8s.gatekeeper.sh  # <-- The key fix is here!
      rego: |
        package k8snetworkpolicyrequired

        violation[{"msg": msg}] {
          namespace_name := input.review.namespace
          namespace_name != ""
          # Note: data.inventory path might need adjustment based on your Gatekeeper setup.
          policies := data.inventory.namespace[namespace_name]["networking.k8s.io/v1"]["NetworkPolicy"]
          not policies
          msg := sprintf("Deployment in Namespace %v is blocked because the Namespace is missing a required NetworkPolicy.", [namespace_name])
        }
